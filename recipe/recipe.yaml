schema_version: 1

context:
  name: rope
  version: "1.15.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/rope-${{ version }}.tar.gz
  sha256: 7ce304aa86350d9454533b6817d0c7c01301b0a4fad356d8372b5d77df35756f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pytoolconfig >=1.2.2

tests:
  - python:
      imports:
        - rope
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: a python refactoring library...
  license: LGPL-3.0-or-later
  license_file: COPYING
  homepage: https://github.com/python-rope/rope
  repository: https://github.com/python-rope/rope

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen
